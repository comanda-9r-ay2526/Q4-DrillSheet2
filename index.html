<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Index Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
</head>
<body>
    <div class="container rounded-4">
        <h1 class="text-light">Heat Index Checker</h1>
        <p class="text-light">Input the temperature and humidity. Click check to see the heat index and status</p><hr>
        <form>
            <label for="degree" class="text-light">Degrees (in &deg;C)</label><br>
            <input type="number" placeholder="0&deg;C" class="form-control" id="degree"><br>
            <label for="humid" class="text-light">Humidity (in &percnt;)</label><br>
            <input type="number" placeholder="0&percnt;" class="form-control" id="humid">
            <center>
                <button type="button" class="btn btn-warning mt-3" onclick="getHeatIndex()">Check</button>
                <button type="button" class="btn btn-light mt-3" onclick="window.location.reload()">Refresh</button>
            </center>
        </form><br><br>
        <center>
            <img src="fire-icon-on-transparent-background-free-png.webp" width="250">
        </center><br>
    </div>
</body>
</html>
